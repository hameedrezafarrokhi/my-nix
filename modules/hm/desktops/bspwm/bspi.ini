[ignore]
; Comma-separated glob patterns (case-insensitive). A window matching
; any of these is completely excluded when computing a desktop's name -
; useful for floating utility windows you don't want dominating the
; display (meeting toolbars, picture-in-picture players, etc).
;
; class    matches the WM_CLASS *class* half   (e.g. "Zoom", "firefox")
; instance matches the WM_CLASS *instance* half (e.g. "zoom", "Navigator")
; title    matches the window title (only fetched from X if this or
;          `all` is non-empty - it's an extra round-trip nothing else needs)
; all      matches class OR instance OR title
;
; class = Zoom, Peek
; instance = tmux-256color
; title = Picture-in-Picture, Save File
; all = Volume Control*

[workspaces]
; Optional per-desktop prefix, prepended to the icon string bspi
; computes for that desktop. Desktops are numbered 1..20 by their
; position on their monitor (the first desktop on a monitor is ws1,
; the second is ws2, and so on) - independent of whatever bspwm's own
; desktop id/name happens to be, since bspi overwrites the name anyway.
; Leave a value empty for "no prefix" (same as leaving the key out
; entirely). Only ws1 through ws20 are recognized.
;
; ws1 = 1
; ws2 = 2
; ws3 =

; Instead of (or alongside) the plain [workspaces] section above, a
; prefix can be broken down by a desktop's current state - see the
; README's "Per-state workspace prefixes" section for exactly how
; these combine with each other and with [workspaces]. Briefly:
;   - none of the four defined  -> [workspaces] used for every state
;   - exactly one defined       -> that one used for every state
;   - two or more defined       -> exact state match, else same-
;                                  occupancy/opposite-focus, else
;                                  [workspaces]
; "Occupied" means the desktop has something worth showing (a sticky-
; only or ignored-only desktop counts as unoccupied); "focused" means
; it's the desktop currently shown on its monitor. No "-focused"
; suffix means the unfocused/idle variant.
; nerdfonts md-numeric_

