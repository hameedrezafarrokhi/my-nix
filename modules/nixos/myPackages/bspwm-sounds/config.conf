# bspwm-sounds config
# Lines starting with # are comments. Sections: [settings], [sounds], [rule:NAME].

[settings]
sample_rate       = 48000
channels          = 2
max_voices        = 10      # max sounds playing at once, across all rules
idle_shutdown_ms  = 400    # stop the audio device after this long with nothing playing
master_volume     = 1.0
cache_dir         = ~/.cache/bspwm-sounds
ffmpeg_path       = ffmpeg
global_min_gap_ms = 0       # extra global floor between any two sounds starting, 0 = off

# Define your sound sources here. Nothing is hardcoded -- add/remove/rename
# freely and reference the alias from [rule:...] blocks below.
# wav/mp3/flac load natively and instantly. ogg/opus/etc get auto-transcoded
# to a cached wav the first time they're seen (needs ffmpeg on PATH).
[sounds]
open_default    = ~/.local/share/desktop-sounds/open
close_default   = ~/.local/share/desktop-sounds/close
switch_default  = ~/.local/share/desktop-sounds/desktop
focus_default   = ~/.local/share/desktop-sounds/focus
#firefox_open    = ~/.local/share/desktop-sounds/firefox-open.mp3
#alert_open      = ~/.local/share/desktop-sounds/alert.wav

# --- Rules -----------------------------------------------------------------
# Each rule needs: event, sound. Everything else is optional.
#   event               node_add | node_remove | node_focus | node_activate |
#                       node_swap | node_transfer | desktop_focus |
#                       desktop_add | desktop_remove | monitor_focus
#   class / instance / title   POSIX EXTENDED regex, always case-insensitive
#                               (no inline flags like "(?i)" -- that's PCRE
#                               syntax and will fail to compile here),
#                               matched against the window that triggered
#                               the event. Only relevant for node_* events.
#   priority            higher wins when the voice pool is full and rules
#                       collide; also picks the winner when several rules
#                       match the SAME event (e.g. a class-specific rule
#                       beating the generic default below).
#   debounce_ms         ignore repeats of *this* rule faster than this
#   max_instances       cap on simultaneous copies of just this rule's sound
#   suppress_if_events  comma list of event names; if any of them fired in
#                       the last suppress_window_ms, drop this rule instead
#                       of playing (e.g. don't play a focus blip right after
#                       a window just opened/closed/desktop-switched)

[rule:open_default]
event       = node_add
sound       = open_default
volume      = 0.5
priority    = 5
debounce_ms = 30

# A specific app gets its own sound and outranks the generic one above.
#[rule:open_firefox]
#event       = node_add
#class       = ^Firefox$
#sound       = firefox_open
#volume      = 0.6
#priority    = 20
#debounce_ms = 30

# Urgent dialogs get top priority and are allowed to interrupt other sounds
# in the voice pool (see max_voices contention rules in the README).
#[rule:open_alert]
#event       = node_add
#title       = warning|error|alert
#sound       = alert_open
#volume      = 0.8
#priority    = 100
#debounce_ms = 0

[rule:close_default]
event       = node_remove
sound       = close_default
volume      = 0.4
priority    = 5
debounce_ms = 30

[rule:desktop_switch]
event              = desktop_focus
sound              = switch_default
volume             = 0.5
priority           = 10
debounce_ms        = 0
max_instances      = 4

[rule:focus_default]
event               = node_focus
sound               = focus_default
volume              = 0.3
priority            = 1
debounce_ms         = 60
max_instances       = 2
suppress_if_events  = node_add,node_remove,desktop_focus
suppress_window_ms  = 60
