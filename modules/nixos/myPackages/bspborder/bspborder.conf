# bspborder.conf
#
# Location: $XDG_CONFIG_HOME/bspborder/bspborder.conf
#           (usually ~/.config/bspborder/bspborder.conf)
#
# ---------------------------------------------------------------------------
# default <color>
#   The color used when nothing else matches.
#
# rule <key>=<value> [<key>=<value> ...] color=<color> [stop]
#   A rule matches a window when ALL of its key=value conditions are true
#   (AND). Rules are evaluated top-to-bottom; every rule that matches
#   overwrites the color chosen so far, so rules further down the file take
#   priority over rules above them — same "last case wins" behavior as the
#   original bash `case` chain. Add `stop` at the end of a rule to stop
#   evaluating further rules the moment it matches, if you want a hard
#   priority ceiling instead of full cascading.
#
# Condition keys:
#   class=<name>       exact match on WM_CLASS class
#   class~=<regex>      POSIX extended regex match on WM_CLASS class
#   instance=<name>      exact match on WM_CLASS instance (res_name)
#   title=<substring>     substring match on the window title
#   title~=<regex>         regex match on the window title
#   type=<TYPE>              _NET_WM_WINDOW_TYPE, without the
#                              _NET_WM_WINDOW_TYPE_ prefix, e.g. DIALOG,
#                              UTILITY, POPUP_MENU, NOTIFICATION, TOOLTIP
#   state=<state>              tiled | floating | fullscreen | pseudo_tiled
#   flag=<flag>                  sticky | private | locked | marked
#
# Values with spaces need double quotes: title~="^Firefox — .*$"
# ---------------------------------------------------------------------------

default #7dc4e4

rule class=firefox color=#fab387
rule class=Brave-browser color=#fab387
rule class=spotify color=#a6da95
rule class=vlc color=#fab387
rule class=heroic color=#8aadf4
rule class=steam color=#8aadf4
rule class=obs color=#ed8796
rule class=freetube color=#ed8796
rule class=uget-gtk color=#a6da95

rule state=floating color=#eed49f

rule class=cbonsai color=#a6da95
rule class=.blueman-manager-wrapped color=#8aadf4
rule class=bluetuith color=#8aadf4
rule class=scratchpad color=#a6da95
rule class=scratchpad-ext color=#f4dbd6
rule class=.protonvpn-app-wrapped color=#c6a0f6
rule class=eyedropper color=#c6a0f6
rule class=pavucontrol color=#eed49f
rule class=tetris color=#f5a97f
rule class=kitty-picker color=#ed8796
rule class=systemctltui color=#ed8796
rule class=XFilesFloat color=#a6da95
rule class=XFilesRoot color=#ed8796
rule class=Xmessage color=#ed8796
rule class=Gxmessage color=#ed8796
rule class=zenity color=#ed8796
rule class=baobab color=#a6da95
rule class=Better_control.py color=#ed8796

rule type=DIALOG color=#ed8796

# Sticky windows always get this color, no matter what else matches —
# ported from the original script, where the sticky case was checked last.
rule flag=sticky color=#ee99a0
